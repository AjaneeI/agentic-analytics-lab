<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Analytics Lab architecture overview</title>
  <desc id="desc">Comparison of the single-agent baseline, routed control plane, read-only ClickHouse boundary, and deterministic evaluation layer.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #57606a; }
    .label { font-size: 18px; font-weight: 650; }
    .small { font-size: 14px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; rx: 14; }
    .accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; rx: 14; }
    .guard { fill: #fff8c5; stroke: #9a6700; stroke-width: 2; rx: 14; }
    .eval { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; rx: 14; }
    .arrow { stroke: #57606a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="60" y="55" class="title">Agentic Analytics Lab</text>
  <text x="60" y="85" class="subtitle">One evidence contract, two execution strategies, explicit safety and evaluation boundaries</text>

  <text x="60" y="135" class="label">Single-agent baseline</text>
  <rect x="60" y="160" width="170" height="78" class="accent"/>
  <text x="145" y="192" text-anchor="middle" class="label">User question</text>
  <text x="145" y="215" text-anchor="middle" class="small">Frozen Q1-Q6 cases</text>

  <rect x="285" y="160" width="210" height="78" class="box"/>
  <text x="390" y="192" text-anchor="middle" class="label">Single agent</text>
  <text x="390" y="215" text-anchor="middle" class="small">qwen2.5:7b via Ollama</text>

  <rect x="550" y="145" width="250" height="108" class="guard"/>
  <text x="675" y="177" text-anchor="middle" class="label">Read-only tool boundary</text>
  <text x="675" y="201" text-anchor="middle" class="small">Dataset scope + SQL safety</text>
  <text x="675" y="222" text-anchor="middle" class="small">Metric semantics + resource caps</text>

  <rect x="855" y="160" width="260" height="78" class="box"/>
  <text x="985" y="192" text-anchor="middle" class="label">ClickHouse evidence</text>
  <text x="985" y="215" text-anchor="middle" class="small">Synthetic delivery operations data</text>

  <path d="M230 199 H285" class="arrow"/>
  <path d="M495 199 H550" class="arrow"/>
  <path d="M800 199 H855" class="arrow"/>

  <text x="60" y="310" class="label">Routed execution experiment</text>
  <rect x="60" y="335" width="190" height="88" class="accent"/>
  <text x="155" y="367" text-anchor="middle" class="label">Request + route facts</text>
  <text x="155" y="391" text-anchor="middle" class="small">Oracle metadata for</text>
  <text x="155" y="411" text-anchor="middle" class="small">the accepted comparison</text>

  <rect x="305" y="335" width="215" height="88" class="box"/>
  <text x="412" y="367" text-anchor="middle" class="label">Typed control plane</text>
  <text x="412" y="391" text-anchor="middle" class="small">deterministic | local | escalate</text>
  <text x="412" y="411" text-anchor="middle" class="small">inspectable reason codes</text>

  <rect x="575" y="300" width="230" height="70" class="box"/>
  <text x="690" y="330" text-anchor="middle" class="label">Deterministic handler</text>
  <text x="690" y="352" text-anchor="middle" class="small">Exact, cheap path when valid</text>

  <rect x="575" y="390" width="230" height="70" class="box"/>
  <text x="690" y="420" text-anchor="middle" class="label">Local AI worker</text>
  <text x="690" y="442" text-anchor="middle" class="small">Reuses the single-agent worker</text>

  <rect x="860" y="335" width="255" height="88" class="eval"/>
  <text x="987" y="367" text-anchor="middle" class="label">Validation + telemetry</text>
  <text x="987" y="391" text-anchor="middle" class="small">fail closed / escalate signals</text>
  <text x="987" y="411" text-anchor="middle" class="small">route, tool, token, latency evidence</text>

  <path d="M250 379 H305" class="arrow"/>
  <path d="M520 379 H550 V335 H575" class="arrow"/>
  <path d="M520 379 H550 V425 H575" class="arrow"/>
  <path d="M805 335 H835 V379 H860" class="arrow"/>
  <path d="M805 425 H835 V379 H860" class="arrow"/>
  <path d="M690 300 V270 H675 V253" class="arrow dash"/>
  <path d="M690 390 V270 H675 V253" class="arrow dash"/>

  <text x="60" y="535" class="label">Evaluation and provenance</text>
  <rect x="60" y="560" width="210" height="94" class="eval"/>
  <text x="165" y="592" text-anchor="middle" class="label">Frozen contract</text>
  <text x="165" y="616" text-anchor="middle" class="small">questions + scorer + data</text>
  <text x="165" y="637" text-anchor="middle" class="small">commit + file fingerprints</text>

  <rect x="325" y="560" width="210" height="94" class="eval"/>
  <text x="430" y="592" text-anchor="middle" class="label">Matched runs</text>
  <text x="430" y="616" text-anchor="middle" class="small">3 trials per architecture</text>
  <text x="430" y="637" text-anchor="middle" class="small">same evaluation contract</text>

  <rect x="590" y="560" width="220" height="94" class="eval"/>
  <text x="700" y="592" text-anchor="middle" class="label">Deterministic scoring</text>
  <text x="700" y="616" text-anchor="middle" class="small">correctness + grounding</text>
  <text x="700" y="637" text-anchor="middle" class="small">execution + epistemic checks</text>

  <rect x="865" y="560" width="250" height="94" class="eval"/>
  <text x="990" y="592" text-anchor="middle" class="label">Failure diagnostics</text>
  <text x="990" y="616" text-anchor="middle" class="small">observable stage classification</text>
  <text x="990" y="637" text-anchor="middle" class="small">no hidden reasoning required</text>

  <path d="M270 607 H325" class="arrow"/>
  <path d="M535 607 H590" class="arrow"/>
  <path d="M810 607 H865" class="arrow"/>

  <text x="60" y="710" class="small">Design rule: architecture complexity advances only when matched evidence shows enough quality, reliability, or efficiency value to justify it.</text>
</svg>