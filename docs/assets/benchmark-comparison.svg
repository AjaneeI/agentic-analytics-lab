<!-- claim boundary -->
<rect x="56" y="580" width="1088" height="118" rx="20" fill="#201D1A" stroke="#3C3732"/>
<text x="84" y="618" class="kicker" fill="#A58A6A">CLAIM BOUNDARY</text>
<text x="84" y="652" class="head" fill="#F4E9DA">This tests execution when the correct route is already known.</text>
<text x="84" y="680" class="body" fill="#B1A598">It does not prove natural-language route inference or a general multi-agent advantage.</text>

<text x="56" y="734" class="tiny" fill="#82786F">Evidence: GitHub Actions baseline run 35755961530 · oracle-routed run 35760422536 · frozen Q1–Q6 benchmark</text>
