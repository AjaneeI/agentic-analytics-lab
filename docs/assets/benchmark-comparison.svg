<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Agentic Analytics Lab benchmark comparison</title>
<desc id="desc">Three GitHub-hosted benchmark runs compare the single-agent baseline with oracle-metadata routed execution. The baseline scored four of six tasks in each run. Oracle-metadata routed execution scored five of six, then six of six, then six of six. Natural-language routing is evaluated separately and is not proven by this comparison.</desc>
<rect width="1200" height="760" rx="28" fill="#0E0D0C"/>
<style>
  .kicker{font:700 15px Inter,system-ui,sans-serif;letter-spacing:1.8px}
  .title{font:750 38px Inter,system-ui,sans-serif}
  .sub{font:500 19px Inter,system-ui,sans-serif}
  .head{font:700 21px Inter,system-ui,sans-serif}
  .metric{font:800 48px Inter,system-ui,sans-serif}
  .body{font:500 17px Inter,system-ui,sans-serif}
  .small{font:600 14px Inter,system-ui,sans-serif;letter-spacing:.4px}
  .tiny{font:500 13px Inter,system-ui,sans-serif}
</style>

<text x="56" y="62" class="kicker" fill="#B66A45">BENCHMARK EVIDENCE</text>
<text x="56" y="110" class="title" fill="#F4E9DA">Known routes improved execution. Routing inference is still separate.</text>
<text x="56" y="146" class="sub" fill="#B1A598">Three accepted GitHub-hosted runs under matched benchmark conditions.</text>

<!-- baseline card -->
<rect x="56" y="194" width="514" height="356" rx="22" fill="#181613" stroke="#3C3732"/>
<text x="86" y="236" class="kicker" fill="#B66A45">SINGLE-AGENT BASELINE</text>
<text x="86" y="290" class="metric" fill="#F4E9DA">4 / 6</text>
<text x="86" y="320" class="body" fill="#B1A598">task success in every run</text>

