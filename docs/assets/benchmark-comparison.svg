  <circle cx="64" cy="12" r="9" fill="#B66A45"/><circle cx="90" cy="12" r="9" fill="#B66A45"/>
  <circle cx="116" cy="12" r="9" fill="#3C3732"/><circle cx="142" cy="12" r="9" fill="#3C3732"/>
</g>
<text x="86" y="458" class="small" fill="#82786F">RUN 3</text>
<g transform="translate(158,442)">
  <circle cx="12" cy="12" r="9" fill="#B66A45"/><circle cx="38" cy="12" r="9" fill="#B66A45"/>
  <circle cx="64" cy="12" r="9" fill="#B66A45"/><circle cx="90" cy="12" r="9" fill="#B66A45"/>
  <circle cx="116" cy="12" r="9" fill="#3C3732"/><circle cx="142" cy="12" r="9" fill="#3C3732"/>
</g>
<text x="86" y="510" class="body" fill="#B1A598">12 / 18 successful tasks across three runs</text>

